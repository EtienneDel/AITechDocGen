name: 'TypeScript Documentation Generator'
description: 'Automatically generates documentation for TypeScript codebases'
author: 'EtienneDel'

inputs:
  claude_api_key:
    description: 'Claude API key for generating documentation'
    required: true
  github_token:
    description: 'GitHub token for accessing PR files and creating commits'
    required: true
    default: ${{ github.token }}
  file_extensions:
    description: 'Comma-separated list of file extensions to process (e.g., .ts,.tsx)'
    required: false
    default: '.ts,.tsx'
  pr_title_prefix:
    description: 'Prefix for the commit message'
    required: false
    default: 'docs: '
  # TypeDoc documentation generator inputs
  docs-directory:
    description: 'Directory where documentation will be generated'
    required: false
    default: 'docs'
  entry-points:
    description: 'Comma-separated list of entry point files for TypeDoc'
    required: true
  tsconfig:
    description: 'Path to tsconfig.json file'
    required: false
    default: 'tsconfig.json'
  plugins:
    description: 'Comma-separated list of TypeDoc plugins to use'
    required: false
  theme:
    description: 'TypeDoc theme to use'
    required: false
    default: 'default'
  project-name:
    description: 'Name of the project for documentation'
    required: false
  exclude-private:
    description: 'Exclude private members from documentation'
    required: false
    default: 'false'
  exclude-protected:
    description: 'Exclude protected members from documentation'
    required: false
    default: 'false'
  exclude-externals:
    description: 'Exclude external modules from documentation'
    required: false
    default: 'false'
  exclude-internal:
    description: 'Exclude members marked as @internal from documentation'
    required: false
    default: 'false'
  readme:
    description: 'Path to README file to include in documentation'
    required: false
    default: 'README.md'
  separate-commits:
    description: 'Create separate commits for TSDoc comments and documentation'
    required: false
    default: 'false'
outputs:
  processed_files:
    description: 'Number of files processed'
  updated_files:
    description: 'Number of files that were updated with documentation'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'book'
  color: 'green'
